<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steganography Tool - Hide Messages in Images</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 Steganography Tool</h1>
            <p>Hide and reveal secret messages in images - 100% Client-Side</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('encrypt')">
                🔒 Encrypt
            </button>
            <button class="tab-button" onclick="switchTab('decrypt')">
                🔓 Decrypt
            </button>
        </div>

        <!-- Encrypt Section -->
        <div id="encrypt-section" class="section active">
            <div class="card">
                <h2>Hide a Message in an Image</h2>
                
                <form id="encrypt-form">
                    <div class="form-group">
                        <label for="encrypt-image">1. Upload an Image (PNG, JPG, JPEG)</label>
                        <input type="file" id="encrypt-image" accept="image/png,image/jpeg,image/jpg" required>
                        <div id="encrypt-image-preview" class="image-preview"></div>
                    </div>

                    <div class="form-group">
                        <label for="message-text">2. Enter Your Secret Message</label>
                        <textarea id="message-text" rows="6" placeholder="Enter your secret message here..." required></textarea>
                        <div class="char-count">
                            <span id="char-count">0</span> characters
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <span class="btn-text">Encrypt & Download</span>
                        <span class="loader" style="display: none;"></span>
                    </button>
                </form>

                <div id="encrypt-result" class="result"></div>
            </div>
        </div>

        <!-- Decrypt Section -->
        <div id="decrypt-section" class="section">
            <div class="card">
                <h2>Reveal Hidden Message</h2>
                
                <form id="decrypt-form">
                    <div class="form-group">
                        <label for="decrypt-image">Upload Encrypted Image (PNG only)</label>
                        <input type="file" id="decrypt-image" accept="image/png" required>
                        <div id="decrypt-image-preview" class="image-preview"></div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <span class="btn-text">Decrypt Message</span>
                        <span class="loader" style="display: none;"></span>
                    </button>
                </form>

                <div id="decrypt-result" class="result"></div>
                
                <div id="message-display" class="message-display" style="display: none;">
                    <h3>Hidden Message:</h3>
                    <div id="decrypted-message" class="message-box"></div>
                    <button id="download-text-btn" class="btn btn-secondary">
                        Download as Text File
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>LSB (Least Significant Bit) Steganography - 100% Client-Side | No data leaves your browser</p>
    </footer>

    <script src="steganography.js"></script>
    <script src="app.js"></script>
</body>
</html>
